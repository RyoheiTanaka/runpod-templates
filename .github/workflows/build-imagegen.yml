name: Build ImageGen image

# imagegen のイメージだけをビルドする。手順は _build-image.yml にある。
#
# - main への push: templates/imagegen/ かビルド用のワークフローが変わったときだけ
# - v* タグ: 常にビルドする（タグは全テンプレート共通。GitHub は tag の push に paths を適用しない）
# - 手動実行: いつでも。ブランチで実行すると sha-<短縮SHA>-<cuda> だけが出る
#
# cuda12.8 だけ。template が host の CUDA を 12.8 に絞っているので、
# cuda13.0 のイメージを作っても使う場面が無い（templates/imagegen/README.md）。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "templates/imagegen/**"
      - ".github/workflows/build-imagegen.yml"
      - ".github/workflows/_build-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cuda12.8
            base: ghcr.io/ryoheitanaka/runpod-comfyui-base:v1-cuda12.8
    uses: ./.github/workflows/_build-image.yml
    with:
      name: imagegen
      image: runpod-templates-imagegen
      tag: ${{ matrix.tag }}
      base: ${{ matrix.base }}
