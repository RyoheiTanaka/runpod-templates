name: Check vLLM SSH startup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "templates/vllm/**"
      - ".github/workflows/check-vllm.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline startup tests
        run: python -m unittest discover -s templates/vllm -p 'test_*.py' -v
      - name: Validate draft template JSON
        run: python -m json.tool templates/vllm/template.json > /dev/null
