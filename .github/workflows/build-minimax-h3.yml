name: Build MiniMax H3 image

# minimax-h3 のイメージだけをビルドする。手順は _build-image.yml にある。
#
# - main への push: templates/minimax-h3/ かビルド用のワークフローが変わったときだけ
# - v* タグ: 常にビルドする（タグは全テンプレート共通。GitHub は tag の push に paths を適用しない）
# - 手動実行: いつでも。ブランチで実行すると sha-<短縮SHA>-<cuda> だけが出る
#
# minimax-h3 は private 利用のみで、共通ベースを使わず自前で全部ビルドしている。据え置く。
# image tag も v2.1.0 のまま上げていない（タグを打つとビルドはされるが、template は古い tag を指す）。

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "templates/minimax-h3/**"
      - ".github/workflows/build-minimax-h3.yml"
      - ".github/workflows/_build-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: cuda12.8
            base: runpod/pytorch:2.8.0-py3.11-cuda12.8.1-cudnn-devel-ubuntu22.04
          - tag: cuda13.0
            base: runpod/pytorch:1.1.0-cu1300-torch291-ubuntu2404
    uses: ./.github/workflows/_build-image.yml
    with:
      name: minimax-h3
      image: runpod-templates-minimax-h3
      tag: ${{ matrix.tag }}
      base: ${{ matrix.base }}
