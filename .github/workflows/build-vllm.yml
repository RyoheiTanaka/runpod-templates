name: Build vLLM SSH image

# Verification branches publish immutable sha tags; main is not changed by this test.
on:
  workflow_dispatch:
  push:
    branches:
      - test/vllm-ssh-20261120
    paths:
      - templates/vllm/**
      - .github/workflows/build-vllm.yml
      - .github/workflows/_build-image.yml

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s templates/vllm -p 'test_*.py' -v
  build:
    needs: check
    uses: ./.github/workflows/_build-image.yml
    with:
      name: vllm
      image: runpod-templates-vllm
      tag: vllm0.34.0
      base: vllm/vllm-openai:v0.34.0
