name: Build ComfyUI base image

# 共通ベース（base/Dockerfile）を GHCR に公開する。
#
# build-images.yml と分けているのは、意図的にビルド契機を絞るため。
# このイメージのタグは acestep15xl / wan22 / Hub repo の Dockerfile から
# ピン留めで参照される。main への push のたびに同じタグを push し直すと、
# 参照側が黙って別の中身を掴むことになる。
#
# したがって:
#   - `base-v*` タグを打ったときだけ、参照用のタグ（例 v1-cuda12.8）を出す
#   - 手動実行（workflow_dispatch）は dev-<cuda> にしか出さない。試すためのもの
#
# 中身を変えたら base-v2 を打ち、参照側の FROM を明示的に上げる。

on:
  workflow_dispatch:
  push:
    tags:
      - "base-v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # build-images.yml の base と同じ組み合わせを維持する。
        # cuda12.8 が Hub の既定（Hub は build-args を渡さないので
        # 各 Dockerfile の ARG 既定値がそのまま使われる）。
        include:
          - tag: cuda12.8
            base: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
          - tag: cuda13.0
            base: runpod/pytorch:1.1.0-cu1300-torch291-ubuntu2404

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ryoheitanaka/runpod-comfyui-base
          tags: |
            type=match,pattern=base-(.*),group=1,suffix=-${{ matrix.tag }}
            type=raw,value=dev-${{ matrix.tag }},enable=${{ github.ref_type != 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
